[project]
name = "local-document-qa"
version = "0.1.0"
description = "Local-first PDF/TXT document question-answering system (RAG)."
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pymupdf>=1.24,<1.25",
    "qdrant-client>=1.11,<1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]
embeddings = [
    "sentence-transformers>=3.0,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: requires a real embedding model download and/or a live Qdrant server; excluded by default (run with -m integration).",
]
